name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: "30.1"

      - name: Install Just
        uses: extractions/setup-just@v3

      - name: Lint Emacs Lisp
        run: just lint-el

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Markdown
        run: npx markdownlint-cli2

      - name: Lint prose
        uses: errata-ai/vale-action@v2
        with:
          version: 3.9.3
          files: README.md
          fail_on_error: true

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs

  test:
    strategy:
      fail-fast: false
      matrix:
        # The minimum version init.el accepts, plus snapshot as an early warning for breaking changes.
        emacs: ["30.1", snapshot]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Install Just
        uses: extractions/setup-just@v3

      - name: Test
        run: just test
